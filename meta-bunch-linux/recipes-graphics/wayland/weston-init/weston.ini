# configuration file for Weston (Bunch Linux)
# weston-init adds backend= and the PACKAGECONFIG-driven keys to [core].

[core]
require-input=false
repaint-window=10
require-outputs=none

[shell]
panel-position=bottom
background-image=/usr/share/backgrounds/background.jpg
background-type=scale
locking=false

# Launched clients inherit WAYLAND_DISPLAY and XDG_RUNTIME_DIR from weston.
[launcher]
icon=/usr/share/weston/terminal1.png
path=/usr/bin/weston-terminal

[launcher]
icon=/usr/share/weston/gear.png
path=QT_QPA_PLATFORM=wayland /usr/bin/sensor-app

[launcher]
icon=/usr/share/weston/burger.png
path=QT_QPA_PLATFORM=wayland /usr/bin/burger-shop

[launcher]
icon=/usr/share/weston/player.png
path=/usr/bin/open-pipe-media-player

[screen-share]
command=/usr/bin/weston --backend=rdp-backend.so --shell=fullscreen-shell.so --no-resizeable
