name: Build on Local Host

on: [workflow_dispatch]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      # The runner must provide the secrets (RAUC keys, hotspot.psk, ...)
      # in a directory outside the workspace, e.g. ~/bunch-linux-secrets.
      - name: Check secrets
        run: |
          test -f "$HOME/bunch-linux-secrets/bunch-auth-update.key.pem" || {
            echo "Missing secrets in ~/bunch-linux-secrets (see secrets/README.md)"; exit 1; }

      - name: Install kas
        run: |
          python3 -m venv .kas-venv
          .kas-venv/bin/pip install --quiet kas

      - name: Link secrets
        run: ln -sf "$HOME"/bunch-linux-secrets/* secrets/

      - name: Build
        run: .kas-venv/bin/kas build kas/bunch-linux-demo.yml
