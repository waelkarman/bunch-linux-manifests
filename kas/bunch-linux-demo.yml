header:
  version: 14

machine: bunch-linux-machine
distro: bunch-linux-dist
target: bunch-linux-bundle

local_conf_header:
  package_customization: |
    PACKAGECONFIG:append:pn-qtbase = " gbm kms eglfs gles2 sql-sqlite fontconfig libinput"
    PACKAGECONFIG:append:pn-qtwayland = " compositor"
    PACKAGECONFIG:append:pn-qtmultimedia = " gstreamer alsa pulseaudio"
    PACKAGECONFIG:pn-gstreamer1.0-plugins-good = "orc soup3 pulseaudio bz2 cairo flac gdk-pixbuf gudev jpeg lame libpng mpg123 speex taglib v4l2"
    EXTRA_OEMESON:append:pn-gstreamer1.0-plugins-good = " -Dximagesrc=disabled"
  graphics: |
    GPU_MEM = "256"
  standard: |
    BUNCH_USE_CASE = "general"
    BUNCH_SECURITY_LEVEL = "standard"
    BUNCH_DEBUG_MODE = "1"
    BUNCH_PRODUCTION_MODE = "0"
    BUNCH_REALTIME = "0"
    BUNCH_ENABLE_GRAPHICS = "1"
    BUNCH_ENABLE_ALL_FEATURES = "1"

    # wlan0 as hotspot routed through WireGuard ("ap") or as Wi-Fi client ("client")
    BUNCH_WLAN_MODE = "ap"

    HDMI_FORCE_HOTPLUG = "1"
    HDMI_DRIVE = "2"
    HDMI_GROUP = "1"
    HDMI_MODE = "16"
    CONFIG_HDMI_BOOST = "4"
    DISABLE_OVERSCAN = "1"

    # Peripherals
    RASPBERRYPI_ACTIVE_BUZZER = "0"
    RASPBERRYPI_PASSIVE_BUZZER = "0"
    RASPBERRYPI_PCA9685 = "1"

    # Hardware and Boot Configuration
    KERNEL_MODULE_AUTOLOAD += "pwm-pca9685 i2c-dev"
    BUNCH_LINUX_IMAGE = "bunch-linux-demo"
    IMAGE_FSTYPES = "wic tar.xz ext4 cpio.gz"
    IMAGE_LINGUAS = "en-us"
    BB_GENERATE_MIRROR_TARBALLS = "1"
    BOOT_DELAY = "0"
    BOOT_DELAY_MS = "0"
    ENABLE_I2C = "1"
    VC4GRAPHICS = "1"
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
    PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
    RPI_USE_U_BOOT = "1"
    WKS_FILE = "rauc-sdimage-raspberrypi.wks"
    BB_NUMBER_THREADS = "10"
    PARALLEL_MAKE = "-j 10"

  buildinfo: |
    USER_CLASSES ?= "buildstats"
    PACKAGE_EXCLUDE = "connman connman-client connman-gnome"

    BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K \
    "

# Yocto Project 6.0 "wrynose" (LTS). Since 5.3 there is no combined poky
# repository any more: bitbake, openembedded-core and meta-yocto are separate.
# bitbake must sit next to openembedded-core (oe-init-build-env looks in ../bitbake).
repos:
  bunch-linux-manifests:
    layers:
      meta-bunch-linux:

  bitbake:
    url: https://git.openembedded.org/bitbake
    path: bitbake
    branch: "2.18"
    commit: 6e260eb6ab1631607ea414d9ff8ede1155faa5d9
    layers:
      .: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    path: openembedded-core
    branch: wrynose
    commit: 2285da08068a6d1b4a64c9a52d85a58be50e4679
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    path: meta-yocto
    branch: wrynose
    commit: 79b6d87030178bed0088ad3b00aa6dfbabac37c4
    layers:
      meta-poky:

  meta-raspberrypi:
    url: https://git.yoctoproject.org/meta-raspberrypi
    path: meta-raspberrypi
    branch: wrynose
    commit: 919588393f41b48cb6c5d832aa35e58a19b6762d

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    path: meta-openembedded
    branch: wrynose
    commit: c0fcd7cca3760ef24e087ac4a31b8f357cb204da
    layers:
      meta-filesystems:
      meta-gnome:
      meta-initramfs:
      meta-multimedia:
      meta-networking:
      meta-oe:
      meta-perl:
      meta-python:
      meta-webserver:

  meta-rauc:
    url: https://github.com/rauc/meta-rauc.git
    path: meta-rauc
    branch: wrynose
    commit: 38da0e5866a953e664001ba90b5edad68d68cd5d

  meta-qt6:
    url: https://code.qt.io/yocto/meta-qt6.git
    path: meta-qt6
    branch: "6.12"
    commit: 10b449ae721b761a5e83b7134e1946f5d995a94f

  meta-clang:
    url: https://github.com/kraj/meta-clang.git
    path: meta-clang
    branch: wrynose
    commit: ef0d22f21910a0c30c967eeb17d8f209806e2d81
